<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A password-protected product design case study by Mohammed Anas." />
    <meta name="theme-color" content="#f8f9fb" />
    <meta http-equiv="cache-control" content="no-store" />
    <title>{{CASE_STUDY_TITLE}} — Mohammed Anas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;family=Geist:wght@400;500&amp;display=swap" rel="stylesheet" />
    <link rel="icon" href="assets/anas-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="case-study.css" />
    <script src="backdrop.js" defer></script>
    <script src="case-study-unlock.js" defer></script>
  </head>
  <body>
    <canvas class="line-field" aria-hidden="true"></canvas>
    <section class="password-gate" id="password-gate" aria-labelledby="gate-title">
      <div class="gate-card">
        <img class="gate-logo" src="assets/anas-logo.svg" alt="" width="42" height="42" />
        <p class="gate-kicker">PRIVATE CASE STUDY</p>
        <h1 id="gate-title">{{CASE_STUDY_TITLE}}</h1>
        <p class="gate-copy">Enter the passcode shared with you to view this project.</p>
        <form class="password-form" id="password-form">
          <label class="is-hidden" for="case-password">Passcode</label>
          <input id="case-password" name="password" type="password" autocomplete="current-password" placeholder="Passcode" required autofocus />
          <button type="submit">View case study</button>
        </form>
        <p class="password-error" id="password-error" role="alert" aria-live="polite"></p>
      </div>
    </section>
    <main class="is-hidden" id="case-study-content"></main>
    <script id="encrypted-case-study" type="application/json">__ENCRYPTED_PAYLOAD__</script>
  </body>
</html>
